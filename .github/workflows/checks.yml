name: checks
on: [push, pull_request]
jobs:
  manager:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash -n deploy.sh && bash -n setup-host.sh && bash -n split/install.sh && bash -n split/build-traffic-sing-box.sh
      - run: python -m py_compile traveler.py tcp_fallback.py tests/integration.py tests/tcp_integration.py tests/external_tcp.py
      - run: python -m py_compile split/install.py split/configure.py split/panel.py split/panel_state.py split/panel_traffic.py split/panel_probe.py split/panel_diagnostics.py
      - run: node --check split/panel-ui/app.js
      - run: python split/install.py install --help
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
