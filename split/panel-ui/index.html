<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Traveler</title>
  <link rel="stylesheet" href="/panel-ui/style.css">
  <script src="/panel-ui/app.js" defer></script>
</head>
<body>
  <main class="panel" id="panel">
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="Traveler, главная">TRAVELER</a>
      <button type="button" id="settings" class="button button-quiet" hidden>Настройки</button>
    </header>
    <p id="loading" class="empty" role="status">Загружаем панель…</p>
    <p id="error" class="alert" role="alert" hidden></p>
    <button type="button" class="button" id="retry" hidden>Повторить</button>
    <section id="screen" aria-labelledby="heading" hidden>
      <button type="button" class="back" id="back" hidden>← К пользователям</button>
      <div class="section-head">
        <h1 id="heading" tabindex="-1">Пользователи</h1>
        <button type="button" id="add" class="button button-primary">+ Пользователь</button>
      </div>
      <p id="telemetry-note" class="telemetry-note" hidden></p>
      <div id="entries" class="entries"></div>
    </section>
  </main>
  <div class="cover" id="cover" hidden>
    <div class="cover-print" aria-hidden="true"></div>
    <span class="cover-title" aria-hidden="true">TRAVELER</span>
    <img class="cover-hero" src="/panel-ui/hero.webp" alt="">
    <button type="button" class="cover-open" id="open" aria-label="Открыть панель"></button>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-note" hidden></p>
      <label class="field" id="name-field" hidden>
        Название
        <input type="text" id="name-input" maxlength="60" autocomplete="off">
      </label>
      <label class="field" id="kind-field" hidden>
        Устройство
        <select id="kind">
          <option value="phone">Телефон</option>
          <option value="laptop">Компьютер</option>
          <option value="tablet">Планшет</option>
          <option value="other">Другое</option>
        </select>
      </label>
      <label class="checkbox" id="intro-field" hidden>
        <input type="checkbox" id="intro"> Показывать заставку при входе
      </label>
      <p id="stats-health" role="status" hidden></p>
      <button type="button" class="back" id="refresh-stats" hidden>Обновить статистику</button>
      <section id="diagnostics" aria-labelledby="diagnostics-title" hidden>
        <h3 id="diagnostics-title">Маршрут Traveler</h3>
        <button type="button" class="button" id="check-route">Проверить маршрут</button>
        <p id="diagnostics-status" role="status" hidden></p>
        <ul id="diagnostics-checks" class="diagnostics-checks"></ul>
      </section>
      <button type="button" class="back" id="replay" hidden>Смотреть заставку ↗</button>
      <p id="dialog-error" class="alert" role="alert" hidden></p>
      <div class="actions dialog-actions">
        <button type="button" id="cancel" class="button button-quiet">Отмена</button>
        <button type="submit" id="submit" class="button button-primary">Сохранить</button>
      </div>
    </form>
  </dialog>
  <dialog id="issue" aria-labelledby="issue-title">
    <p class="issue-label" id="issue-label"></p>
    <h2 id="issue-title" tabindex="-1"></h2>
    <div class="issue-options">
      <div>
        <h3>На этом устройстве</h3>
        <p>Скачайте файл и импортируйте его в sing-box.</p>
        <a class="button button-primary" id="issue-json">Скачать JSON</a>
      </div>
      <div>
        <h3>На другом устройстве</h3>
        <p>Откройте QR здесь и отсканируйте его через sing-box на другом устройстве.</p>
        <a class="button" id="issue-qr">Показать QR</a>
      </div>
    </div>
    <p id="issue-status" class="issue-status" role="status"></p>
    <time id="issue-time" class="reading-time" hidden></time>
    <div class="actions dialog-actions">
      <button type="button" id="issue-close" class="button button-quiet">К устройствам</button>
    </div>
  </dialog>
</body>
</html>
