services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # --- обфускация AmneziaWG (нужен kernel-модуль на хосте) ---
      - EXPERIMENTAL_AWG=true
      # --- unattended setup: создаёт админа/хост/сеть при ПЕРВОМ запуске ---
      - INIT_ENABLED=true
      - INIT_USERNAME=${INIT_USERNAME}
      - INIT_PASSWORD=${INIT_PASSWORD}
      - INIT_HOST=${SERVER_IP}
      - INIT_PORT=${WG_PORT:-443}
      - INIT_DNS=${INIT_DNS:-1.1.1.1,8.8.8.8}
      - INIT_IPV4_CIDR=10.8.0.0/24
      - INIT_IPV6_CIDR=fdcc:ad94:bacf:61a4::/64
      - INIT_ALLOWED_IPS=0.0.0.0/0,::/0
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      # WireGuard слушает несколько UDP-портов — все ведут в один и тот же VPN.
      # Смысл: ни один UDP-порт не открыт во ВСЕХ сетях (где-то режут QUIC/443,
      # где-то DPI бьёт по 51820). На «вредной» сети клиент переключается на
      # другой порт, просто поменяв число в строке Endpoint= своего конфига.
      # Открытые порты не делают сервер «открытым DNS/IPsec»: всё, что не
      # WireGuard, молча отбрасывается, для амплификации не годится.
      - "${WG_PORT:-443}:${WG_PORT:-443}/udp"        # основной (маскировка под QUIC); не конфликтует с Caddy 443/TCP
      - "4500:${WG_PORT:-443}/udp"                   # IPsec NAT-T — часто в белых списках
      - "${BIND_IP:-0.0.0.0}:53:${WG_PORT:-443}/udp" # DNS-порт — пролазит на самых строгих сетях; bind к IP, чтобы не задеть systemd-resolved
    # Базовый healthcheck образа использует `wg show`, который НЕ видит
    # amneziawg-интерфейс → контейнер вечно "unhealthy" при EXPERIMENTAL_AWG.
    # Переопределяем на `awg show`, чтобы статус был корректным.
    healthcheck:
      test: ["CMD-SHELL", "awg show | grep -q interface || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - SERVER_IP=${SERVER_IP}
    ports:
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wg

volumes:
  etc_wireguard:
    name: etc_wireguard
  caddy_data:
  caddy_config:

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
